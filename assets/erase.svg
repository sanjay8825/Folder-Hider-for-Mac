<text x="500" y="410" text-anchor="middle" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="150" font-weight="700" fill="#eef0ff">10</text><text x="500" y="462" text-anchor="middle" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="26" fill="#9aa0c3">attempts allowed</text>
